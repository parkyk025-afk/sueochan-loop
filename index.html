<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>수어찬 반복 재생</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  /* Layout: bright spring stage — big player card left, colorful song cards right (stacked on phones).
     Deliberately single bright theme: every color set explicitly. */
  :root{
    color-scheme: light;
    --ink:#3a2a35; --muted:#7a6470; --paper:#ffffff;
    --pink:#ff5f8f; --pink-soft:#ffe3ec;
    --sun:#ffb81c; --sun-soft:#fff1c9;
    --sky:#2fa8e8; --sky-soft:#dcf1fc;
    --leaf:#3cc48a; --leaf-soft:#dcf7ea;
    --display:"Jua","Gowun Dodum","Malgun Gothic",sans-serif;
    --body:"Gowun Dodum","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0; color:var(--ink); font-family:var(--body); font-size:16px;
    background:
      radial-gradient(circle at 10% 0%, #ffe6ee 0, transparent 45%),
      radial-gradient(circle at 95% 100%, #ffeef2 0, transparent 45%),
      #fffafc;
    background-attachment: fixed;
    min-height:100vh;
  }
  .wrap{max-width:1200px;margin:0 auto;padding-block:28px 48px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px))}

  /* Header */
  header{display:flex;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .badge{width:64px;height:64px;flex:none;border-radius:20px;display:grid;place-items:center;
    background:var(--pink);box-shadow:0 8px 20px rgba(255,95,143,.25)}
  .badge svg{width:38px;height:38px}
  h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,44px);margin:0;line-height:1.1;
    text-wrap:balance;color:var(--pink)}
  h1 em{font-style:normal;color:var(--ink)}
  .sub{margin:4px 0 0;color:var(--muted);font-size:16px}

  .grid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:22px;align-items:start}
  @media (max-width:880px){.grid{grid-template-columns:minmax(0,1fr)}}

  /* Stage */
  .stage{background:var(--paper);border-radius:26px;padding:14px;min-width:0;
    box-shadow:0 18px 40px rgba(255,95,143,.14)}
  video.main{display:block;width:100%;max-width:100%;aspect-ratio:16/9;background:#1d1220;border-radius:18px}
  .nowbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 6px 4px}
  .now{font-family:var(--display);font-size:24px;margin-right:auto;min-width:0;color:var(--ink)}
  .eq{display:inline-flex;gap:3px;align-items:flex-end;height:18px;margin-right:8px;vertical-align:middle}
  .eq i{width:4px;border-radius:2px;background:var(--pink);height:6px}
  .playing .eq i{animation:eq .9s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:.15s}
  .eq i:nth-child(3){animation-delay:.3s}
  .eq i:nth-child(4){animation-delay:.45s}
  @keyframes eq{0%,100%{height:5px}50%{height:18px}}
  .timer{font-family:var(--display);font-size:18px;padding:8px 16px;border-radius:999px;
    background:var(--pink-soft);color:#c23a66;font-variant-numeric:tabular-nums}

  .controls{display:flex;flex-wrap:wrap;gap:14px 22px;padding:12px 6px 6px;align-items:center}
  .group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .group > span{font-size:14px;color:var(--muted);margin-right:2px}
  .chip{font:inherit;font-size:15px;border:2px solid transparent;cursor:pointer;
    padding:7px 14px;border-radius:999px;background:#f6eef2;color:var(--ink);transition:transform .12s, background .12s}
  .chip:hover{transform:translateY(-1px);background:var(--pink-soft)}
  .chip[aria-pressed="true"]{background:var(--pink);color:#fff;box-shadow:0 4px 12px rgba(255,95,143,.35)}
  .fs{font:inherit;font-family:var(--display);font-size:18px;border:0;cursor:pointer;margin-left:auto;
    padding:10px 20px;border-radius:999px;color:#fff;
    background:var(--pink);box-shadow:0 6px 16px rgba(255,95,143,.3)}
  .fs:hover{filter:brightness(1.05);transform:translateY(-1px)}
  button:focus-visible{outline:3px solid #c23a66;outline-offset:2px}

  /* Song cards */
  .side{display:flex;flex-direction:column;gap:14px;min-width:0}
  .side h2{font-family:var(--display);font-weight:400;font-size:28px;margin:2px 4px 2px;color:var(--pink);
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .side h2 small{font-family:var(--body);font-size:14px;color:#c23a66;background:var(--paper);
    padding:3px 10px;border-radius:999px}
  .picker{background:var(--pink-soft);border:2px solid #ffc2d4;border-radius:26px;padding:18px 16px;
    box-shadow:0 14px 34px rgba(255,95,143,.18)}
  .item{--c:var(--pink);--soft:var(--pink-soft);
    display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:10px;cursor:pointer;
    font:inherit;color:var(--ink);background:var(--paper);border:3px solid transparent;border-radius:20px;
    box-shadow:0 6px 16px rgba(194,58,102,.12);transition:transform .15s, box-shadow .15s}
  .item:hover{transform:translateY(-2px);border-color:#ffc2d4;box-shadow:0 12px 26px rgba(194,58,102,.18)}
  .item.on{border-color:var(--c);background:var(--c);color:#fff;box-shadow:0 12px 28px rgba(255,95,143,.4)}
  .item.on span{color:#ffe3ec}
  .item.on .num{background:#fff;color:var(--pink)}
  .item.on .pill{background:#fff;color:var(--pink)}
  .play{position:absolute;inset:0;display:grid;place-items:center}
  .play::before{content:"";width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);
    box-shadow:0 3px 10px rgba(0,0,0,.25)}
  .play::after{content:"";position:absolute;border-style:solid;border-width:8px 0 8px 13px;
    border-color:transparent transparent transparent var(--pink);margin-left:4px}
  .thumb{position:relative;flex:none}
  .thumb video{display:block;width:150px;max-width:100%;aspect-ratio:16/9;border-radius:12px;background:#1d1220;pointer-events:none}
  .num{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
    background:var(--c);color:#fff;font-family:var(--display);font-size:16px;box-shadow:0 3px 8px rgba(0,0,0,.18)}
  .item b{display:block;font-family:var(--display);font-weight:400;font-size:24px;margin-bottom:2px}
  .item span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
  .pill{display:none;font-style:normal;margin-top:6px;font-size:13px;padding:2px 9px;border-radius:999px;background:var(--c);color:#fff}
  .item.on .pill{display:inline-block}
  .hint{margin:0;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.75);
    color:var(--muted);font-size:14px;line-height:1.7}
  kbd{font-family:inherit;background:#fff;border:1px solid #eadbe2;border-bottom-width:2px;border-radius:6px;padding:0 6px;color:var(--ink)}

  /* Falling petals (decorative) */
  .petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .petals i{position:absolute;top:-20px;width:14px;height:10px;border-radius:70% 0 70% 0;opacity:.7;
    animation:fall linear infinite}
  .wrap{position:relative;z-index:1}
  @keyframes fall{to{transform:translate(60px,110vh) rotate(540deg)}}
  @media (prefers-reduced-motion: reduce){
    .petals{display:none}
    .playing .eq i{animation:none;height:12px}
    .chip,.item,.fs{transition:none}
  }
</style>

<div class="petals" aria-hidden="true">
  <i style="left:12%;background:#ffc2d4;animation-duration:18s;animation-delay:-4s"></i>
  <i style="left:47%;background:#ffd3e0;animation-duration:22s;animation-delay:-12s"></i>
  <i style="left:84%;background:#ffc2d4;animation-duration:20s;animation-delay:-8s"></i>
</div>

<div class="wrap">
  <header>
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 40 40" fill="none">
        <g fill="#fff">
          <circle cx="20" cy="11" r="6.5"/><circle cx="28.6" cy="17.2" r="6.5"/><circle cx="25.3" cy="27.3" r="6.5"/>
          <circle cx="14.7" cy="27.3" r="6.5"/><circle cx="11.4" cy="17.2" r="6.5"/>
        </g>
        <circle cx="20" cy="20" r="5.5" fill="#ffd3e0"/>
      </svg>
    </div>
    <div>
      <h1>수어찬 <em>반복 재생</em></h1>
      <p class="sub">곡을 고르면 정한 시간 동안 계속 반복해서 재생됩니다.</p>
    </div>
  </header>

  <div class="grid">
    <div class="stage" id="stage">
      <video class="main" id="player" controls playsinline preload="metadata"></video>
      <div class="nowbar">
        <div class="now"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="now"></span></div>
        <div class="timer" id="timer">재생을 누르면 시작해요</div>
      </div>
      <div class="controls">
        <div class="group" role="group" aria-label="반복 방식">
          <span>반복</span>
          <button class="chip" type="button" id="m-one" data-mode="one" aria-pressed="true">이 곡만</button>
          <button class="chip" type="button" id="m-all" data-mode="all" aria-pressed="false">세 곡 차례로</button>
        </div>
        <div class="group" role="group" aria-label="재생 시간">
          <span>시간</span>
          <button class="chip t" type="button" id="t20" data-min="20" aria-pressed="false">20분</button>
          <button class="chip t" type="button" id="t30" data-min="30" aria-pressed="false">30분</button>
          <button class="chip t" type="button" id="t60" data-min="60" aria-pressed="true">1시간</button>
          <button class="chip t" type="button" id="t120" data-min="120" aria-pressed="false">2시간</button>
          <button class="chip t" type="button" id="t0" data-min="0" aria-pressed="false">계속</button>
        </div>
        <button class="fs" id="fs" type="button">⛶ 전체화면</button>
      </div>
    </div>

    <div class="side picker">
      <h2>노래 고르기 <small>눌러서 재생</small></h2>
      <div class="side" id="list"></div>
      <p class="hint"><kbd>스페이스</kbd> 재생/멈춤 · <kbd>F</kbd> 전체화면 · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 곡 선택</p>
    </div>
  </div>
</div>

<script>
  const songs = [
    { title: "수어찬 01", file: "sueochan01.mp4", len: "3:18" },
    { title: "수어찬 02", file: "sueochan02.mp4", len: "2:46" },
    { title: "너는 꽃이야", file: "flower.mp4", len: "2:45" }
  ];
  const $ = id => document.getElementById(id);
  const player = $("player"), list = $("list"), now = $("now"), timerEl = $("timer"), stage = $("stage");
  let current = 0, endAt = 0, tick = null, pausedAt = 0, mode = "one", limitMin = 60;

  songs.forEach((s, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "item";
    b.innerHTML = `<div class="thumb"><video muted preload="metadata" src="${s.file}#t=15"></video><div class="play"></div><div class="num">${i + 1}</div></div>
      <div><b>${s.title}</b><span>원곡 ${s.len}</span><br><em class="pill">▶ 지금 곡</em></div>`;
    b.addEventListener("click", () => select(i, true));
    list.appendChild(b);
  });

  document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => {
    mode = b.dataset.mode; player.loop = mode === "one";
    document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", x === b));
  }));
  document.querySelectorAll("[data-min]").forEach(b => b.addEventListener("click", () => {
    limitMin = Number(b.dataset.min);
    document.querySelectorAll("[data-min]").forEach(x => x.setAttribute("aria-pressed", x === b));
    if (!player.paused) startTimer(); else { clearInterval(tick); tick = null; timerEl.textContent = "재생을 누르면 시작해요"; }
  }));

  function select(i, start, keepTimer){
    current = i;
    player.src = songs[i].file;
    player.loop = mode === "one";
    now.textContent = songs[i].title;
    [...list.children].forEach((el, k) => el.classList.toggle("on", k === i));
    try { localStorage.setItem("song", String(i)); } catch(e) {}
    if (start) { if (!keepTimer) startTimer(); player.play().catch(() => {}); }
  }

  function startTimer(){
    endAt = limitMin ? Date.now() + limitMin * 60000 : 0;
    clearInterval(tick);
    tick = setInterval(update, 1000);
    update();
  }

  function update(){
    if (!endAt) { timerEl.textContent = "♾ 계속 반복 중"; return; }
    if (player.paused) return;
    const left = Math.max(0, endAt - Date.now());
    if (left === 0) {
      clearInterval(tick); tick = null; player.pause();
      timerEl.textContent = "정한 시간이 끝났어요";
      return;
    }
    const t = Math.ceil(left / 1000);
    const h = Math.floor(t / 3600), mm = Math.floor(t % 3600 / 60), ss = t % 60;
    timerEl.textContent = "⏱ 남은 시간 " + (h ? h + ":" : "") +
      String(mm).padStart(h ? 2 : 1, "0") + ":" + String(ss).padStart(2, "0");
  }

  player.addEventListener("pause", () => { pausedAt = Date.now(); stage.classList.remove("playing"); });
  player.addEventListener("play", () => {
    if (!tick) startTimer();
    else if (pausedAt && endAt) endAt += Date.now() - pausedAt;
    pausedAt = 0; update(); stage.classList.add("playing");
  });
  player.addEventListener("ended", () => {
    if (mode === "all") { pausedAt = 0; select((current + 1) % songs.length, true, true); }
  });

  function goFull(){
    try { const p = player.requestFullscreen && player.requestFullscreen(); if (p) p.catch(() => {}); } catch(e) {}
  }
  $("fs").addEventListener("click", goFull);
  document.addEventListener("keydown", e => {
    if (e.key === " ") { e.preventDefault(); player.paused ? player.play().catch(()=>{}) : player.pause(); }
    else if (e.key === "f" || e.key === "F") goFull();
    else if (["1","2","3"].includes(e.key)) select(Number(e.key) - 1, true);
  });

  let first = 0;
  try { first = Number(localStorage.getItem("song")) || 0; } catch(e) {}
  select(first < songs.length ? first : 0, false);
</script>

</body>
</html>
